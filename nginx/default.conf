server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Repassa as chamadas da API para o container "api".
  # Assim o navegador (PC ou celular) usa o mesmo endereço da página.
  location /pokemons {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
  }

  location = /health {
    proxy_pass http://api:8080;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
