services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - dados-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "mongodb://localhost:27017/admin", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      PORT: "8080"
      MONGO_URL: mongodb://mongodb:27017
      MONGO_DB: pokedex
      BASIC_USER: admin
      BASIC_PASSWORD: secret
    ports:
      - "8080:8080"
  frontend:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
volumes:
  dados-mongo:
